name: Deploy to Hostinger

on:
  push:
    branches:
      - main
  workflow_dispatch: # Allows manual trigger from GitHub UI

jobs:
  deploy:
    runs-on: self-hosted

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build application
        run: npm run build

      - name: Debug - Check secrets are set
        run: |
          echo "SERVER_HOST is set: ${{ secrets.SERVER_HOST != '' }}"
          echo "SERVER_USER is set: ${{ secrets.SERVER_USER != '' }}"
          echo "SERVER_SSH_KEY is set: ${{ secrets.SERVER_SSH_KEY != '' }}"
          echo "SERVER_PATH is set: ${{ secrets.SERVER_PATH != '' }}"
          echo "SERVER_HOST length: ${#SERVER_HOST}"
        env:
          SERVER_HOST: ${{ secrets.SERVER_HOST }}

      - name: Deploy to Server
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          port: ${{ secrets.SERVER_PORT || 22 }}
          debug: true
          script: |
            # Navigate to project directory
            cd ${{ secrets.SERVER_PATH }}

            # Pull latest code
            git pull origin main

            # Install dependencies
            npm ci --production=false

            # Build the project
            npm run build

            # Run migrations (if any)
            npm run typeorm:migrate || echo "No migrations to run"

            # Restart PM2 process
            pm2 restart kabstore-api || pm2 start dist/main.js -i 1 --name kabstore-api --max-memory-restart 1G

            # Save PM2 configuration
            pm2 save

      - name: Deployment Status
        if: success()
        run: echo "✅ Deployment successful!"

      - name: Deployment Failed
        if: failure()
        run: echo "❌ Deployment failed! Check logs above."
